; ESP32 冷氣 IR 遙控器韌體（ESP32 / ESP32-S，例如 NodeMCU-32S）
; 最簡單：點兩下 ../flash_esp32.bat
; 手動：  python -m platformio run -t upload
; 監看：  python -m platformio device monitor

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  ; master 已支援 ESP32 Arduino core 2.x / 3.x，固定在這個 commit 確保可重現
  https://github.com/crankyoldgit/IRremoteESP8266.git#1e2f0f3
  bblanchon/ArduinoJson@^7.2.0
