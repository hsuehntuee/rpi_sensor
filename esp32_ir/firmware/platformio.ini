; ESP32 冷氣 IR 遙控器韌體（ESP32 / ESP32-S，例如 NodeMCU-32S）
; 每間房的冷氣不同，韌體各自寫死協定：
;   esp32_304D  304D 日立 RAS-36UK（HITACHI_AC1，遙控器 R-LT0541-HTA-B）
;   esp32_614   614 東元 MS80IH（ELECTRA_AC）
; Windows：點兩下 ../flash_304D.bat 或 ../flash_614.bat
; 手動：  python -m platformio run -e esp32_614 -t upload

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  ; master 已支援 ESP32 Arduino core 2.x / 3.x，固定在這個 commit 確保可重現
  https://github.com/crankyoldgit/IRremoteESP8266.git#1e2f0f3
  bblanchon/ArduinoJson@^7.2.0

[env:esp32_304D]
build_flags =
  ${env.build_flags}
  '-DDEFAULT_PROTOCOL="HITACHI_AC1"'
  '-DDEFAULT_MODEL="R-LT0541-HTA-B"'

[env:esp32_614]
build_flags =
  ${env.build_flags}
  '-DDEFAULT_PROTOCOL="ELECTRA_AC"'
